# Render Blueprint for the PayFlow REST API + PostgreSQL (the Next.js dashboard stays on Vercel).
# Secrets marked `sync: false` are entered in the Render dashboard on first apply and never live in git.
# See docs/deployment.md.
databases:
  - name: payflow-db
    databaseName: payflow
    user: payflow
    plan: basic-256mb   # paid tier: the free tier is deleted after 30 days, which would erase payment history
    postgresMajorVersion: "17"
    ipAllowList: []     # private network only; no public database access
services:
  - type: web
    name: payflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter       # always-on: free instances sleep, which would break SSE and the Visa reconciler
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - { key: DB_HOST, fromDatabase: { name: payflow-db, property: host } }
      - { key: DB_PORT, fromDatabase: { name: payflow-db, property: port } }
      - { key: DB_NAME, fromDatabase: { name: payflow-db, property: database } }
      - { key: DB_USER, fromDatabase: { name: payflow-db, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: payflow-db, property: password } }
      - { key: PAYFLOW_REQUIRE_STRONG_KEYS, value: "true" }
      - { key: PAYFLOW_SEED_DEMO_DATA, value: "false" }
      - { key: PAYFLOW_ACTUATOR_EXPOSURE, value: "health" }   # no public /actuator/prometheus
      - { key: PAYFLOW_OTLP_ENABLED, value: "false" }
      - { key: PAYFLOW_VISA_ENABLED, value: "false" }         # flip to "true" only after the three credentials below are set
      - { key: PAYFLOW_DEMO_API_KEY, sync: false }            # >= 32 random chars; must equal Vercel's PAYFLOW_DEMO_API_KEY
      - { key: PAYFLOW_VISA_MERCHANT_ID, sync: false }
      - { key: PAYFLOW_VISA_KEY_ID, sync: false }
      - { key: PAYFLOW_VISA_SHARED_SECRET, sync: false }
